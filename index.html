<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="DN808 plugin archive" />
    <title>DN808</title>
    <style>
      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background-color: #050505;
        background-image:
          radial-gradient(circle at 18% 22%, #f2ead8 0 1px, transparent 1.5px),
          radial-gradient(circle at 72% 38%, #f5c400 0 1px, transparent 1.5px),
          radial-gradient(circle at 42% 78%, #e87918 0 1px, transparent 1.5px),
          radial-gradient(circle at 86% 82%, #d74319 0 1px, transparent 1.5px),
          radial-gradient(circle at 55% 14%, #77736b 0 1px, transparent 1.5px),
          radial-gradient(circle at 28% 62%, #a71918 0 1px, transparent 1.5px);
        background-size: 67px 67px, 109px 109px, 151px 151px, 197px 197px, 83px 83px, 127px 127px;
        background-position: 0 0, 19px 31px, 43px 7px, 11px 59px, 37px 23px, 73px 41px;
      }

      canvas {
        width: min(94vw, 920px);
        height: auto;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      noscript pre {
        color: #f5c400;
        font: 12px/1.3 monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas id="terminal" width="420" height="220" aria-label="DN808 plugin archive. Status online. Files coming soon. Contact displayname808@gmail.com."></canvas>

    <noscript><pre>┌─ DN808 / PLUGIN ARCHIVE ─────────────────────┐
│  STATUS : ONLINE                             │
│  FILES  : COMING SOON                        │
│  CONTACT: displayname808@gmail.com           │
└──────────────────────────────────────────────┘</pre></noscript>

    <script>
      const canvas = document.querySelector("#terminal");
      const output = canvas.getContext("2d");
      const base = document.createElement("canvas");
      const screen = base.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;

      base.width = width;
      base.height = height;
      output.imageSmoothingEnabled = false;
      screen.imageSmoothingEnabled = false;

      const palette = {
        black: "#050505",
        gray: "#77736b",
        cream: "#f2ead8",
        yellow: "#f5c400",
        orange: "#e87918",
        redOrange: "#d74319",
        red: "#a71918"
      };

      const rows = [
        ["┌─ DN808 / PLUGIN ARCHIVE ─────────────────────┐", palette.yellow],
        ["│                                              │", palette.gray],
        ["│  STATUS : ONLINE                             │", palette.cream],
        ["│  FILES  : COMING SOON ■                      │", palette.orange],
        ["│                                              │", palette.gray],
        ["│  This is the home of my OP-1 Opus plugins.   │", palette.cream],
        ["│  Downloads and instructions will live here.  │", palette.yellow],
        ["│  CONTACT: displayname808@gmail.com           │", palette.redOrange],
        ["│                                              │", palette.gray],
        ["└──────────────────────────────────────────────┘", palette.red]
      ];

      function buildBase() {
        screen.clearRect(0, 0, width, height);
        screen.font = "700 13px monospace";
        screen.textBaseline = "top";

        rows.forEach(([text, color], index) => {
          const x = 17;
          const y = 22 + index * 18;
          screen.fillStyle = color;
          screen.fillText(text, x, y);
        });
      }

      function render() {
        output.clearRect(0, 0, width, height);
        output.globalAlpha = 1;
        output.drawImage(base, 0, 0);
      }

      buildBase();
      render();
    </script>
  </body>
</html>
